<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Squash Masters — Vídeos de Marcelo Abelheira</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --mel:#F5B700; --mel-esc:#C99200; --mel-claro:#FFF4CC;
  --tinta:#1B1B1F; --tinta2:#2A2A31; --cinza:#6B6B76; --linha:#E6E3DA;
  --fundo:#FAF8F2; --branco:#fff;
  --torneio:#0E6E8C; --turismo:#B5481F; --aus:#2E7D4F;
  --raio:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.45}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* Cabeçalho */
header.topo{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:1000;border-bottom:4px solid var(--mel)}
.topo-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--mel);display:grid;place-items:center;font-size:22px;flex:none;cursor:pointer}
.topo h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.topo small{display:block;color:#C9C9D1;font-size:12.5px;font-weight:400}
.topo .home-btn{margin-left:auto;background:transparent;border:1px solid #55555f;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px}
.topo .home-btn:hover{border-color:var(--mel);color:var(--mel)}

main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}

/* Hero */
.hero{background:linear-gradient(120deg,var(--tinta) 0%,var(--tinta2) 60%,#3a3220 100%);color:#fff;border-radius:var(--raio);padding:34px 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--mel) 0%,rgba(245,183,0,0) 70%);opacity:.35;pointer-events:none}
.hero .tag{display:inline-block;background:var(--mel);color:var(--tinta);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase}
.hero h2{font-size:30px;margin:12px 0 8px;line-height:1.15}
.hero p{color:#D8D8DF;max-width:720px;font-size:15px}
.hero .nums{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hero .nums b{display:block;font-size:26px;color:var(--mel)}
.hero .nums span{font-size:12.5px;color:#C9C9D1}
.hero .destaque{margin-top:18px;background:var(--mel);color:var(--tinta);border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;position:relative;z-index:1}
.hero .destaque:hover{background:#fff}

/* Cards principais */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.cards3.n2{grid-template-columns:repeat(2,1fr)}
.card-main{background:var(--branco);border-radius:var(--raio);overflow:hidden;border:1px solid var(--linha);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card-main:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09)}
.card-main .capa{height:150px;background:#333 center/cover no-repeat;position:relative;cursor:pointer}
.card-main .capa::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.card-main .capa .ttl{position:absolute;left:16px;bottom:12px;right:16px;color:#fff;font-weight:700;font-size:19px;line-height:1.2}
.card-main .faixa{height:5px}
.card-main .corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-main .qtd{font-size:13px;color:var(--cinza)}
.card-main ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card-main li button{width:100%;text-align:left;background:var(--fundo);border:1px solid var(--linha);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.card-main li button:hover{border-color:var(--mel-esc);background:var(--mel-claro)}
.card-main li .n{font-size:12px;color:var(--cinza);background:#fff;border:1px solid var(--linha);border-radius:999px;padding:1px 8px}
.card-main .abrir{margin-top:auto;background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:600}
.card-main .abrir:hover{background:var(--mel);color:var(--tinta)}

/* Seções e mapa */
.secao{margin-top:34px}
.secao h3{font-size:20px;display:flex;align-items:center;gap:10px}
.secao h3::before{content:"";width:6px;height:22px;background:var(--mel);border-radius:3px}
.secao .sub{color:var(--cinza);font-size:14px;margin:4px 0 14px}
#mapa{height:440px;border-radius:var(--raio);border:1px solid var(--linha);background:#dfe8ee;z-index:0}
.mapa-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chip{background:#fff;border:1px solid var(--linha);border-radius:999px;padding:6px 13px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--mel-esc);background:var(--mel-claro)}
.chip.ativo{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip .n{font-size:11.5px;opacity:.75}
.chip.sec{background:transparent;border-style:dashed}
.leaflet-popup-content{font-family:inherit;font-size:13.5px}
.pop b{font-size:15px}
.pop button{margin-top:8px;background:var(--mel);border:0;border-radius:8px;padding:6px 12px;font-weight:600;width:100%}
.mk{background:var(--mel);border:3px solid var(--tinta);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.menor{background:#fff}
.mk-lbl{background:var(--tinta);color:#fff;border:0;border-radius:6px;font-weight:600;font-size:12px;padding:2px 7px;box-shadow:none}
.mk-lbl::before{display:none}

/* Edições */
.edicoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ed{border-radius:var(--raio);overflow:hidden;position:relative;min-height:190px;color:#fff;cursor:pointer;background:#333 center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s,box-shadow .15s;border:0;text-align:left}
.ed::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.82) 100%)}
.ed:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.ed .in{position:relative;padding:16px}
.ed .ano{display:inline-block;background:var(--mel);color:var(--tinta);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px}
.ed .pais{font-size:21px;font-weight:700;margin-top:6px;line-height:1.15}
.ed .cid{font-size:13px;opacity:.85}
.ed .q{font-size:12.5px;opacity:.85;margin-top:6px}
.ed.breve{cursor:default;background:linear-gradient(135deg,#007749 0%,#007749 34%,#FFB81C 34%,#FFB81C 40%,#000 40%,#000 60%,#DE3831 60%,#DE3831 66%,#002395 66%)}
.ed.breve:hover{transform:none;box-shadow:none}
.ed.breve .selo{position:absolute;top:12px;right:12px;background:#fff;color:var(--tinta);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:1}

/* Tela de categoria */
.voltar{background:transparent;border:0;color:var(--cinza);font-size:14px;margin-bottom:10px;padding:4px 0}
.voltar:hover{color:var(--tinta)}
.cab-cat{border-radius:var(--raio);padding:24px 26px;color:#fff;position:relative;overflow:hidden}
.cab-cat .ev{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.8}
.cab-cat h2{font-size:26px}
.cab-cat p{opacity:.88;font-size:14.5px;margin-top:4px}
.abas{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.abas2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px;padding:10px 12px;background:#fff;border:1px solid var(--linha);border-radius:12px}
.abas2 .rot{font-size:12.5px;color:var(--cinza);align-self:center;margin-right:4px}
.info-lista{font-size:13.5px;color:var(--cinza);margin:12px 0}
.busca{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--linha);border-radius:10px;font:inherit;background:#fff}
.busca:focus{outline:2px solid var(--mel);border-color:var(--mel)}

/* Grade de vídeos */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vid{background:#fff;border:1px solid var(--linha);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.vid:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.vid .th{aspect-ratio:16/9;background:#222 center/cover no-repeat;position:relative}
.vid .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:2px 6px;border-radius:5px}
.vid .th .num{position:absolute;left:8px;top:8px;background:var(--mel);color:var(--tinta);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.vid .th .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25)}
.vid:hover .th .play{opacity:1}
.vid .th .play span{width:52px;height:52px;border-radius:50%;background:var(--mel);display:grid;place-items:center;font-size:20px;padding-left:3px}
.vid .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.vid .tt{font-size:14.5px;font-weight:600;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tg{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.tg.T{color:var(--torneio);border-color:#b8dbe6;background:#eef8fb}
.tg.U{color:var(--turismo);border-color:#f0c9b8;background:#fdf3ef}
.tg.A{color:var(--aus);border-color:#bfe0cc;background:#f0f9f3}
.tg.c{color:#555;border-color:#ddd;background:#f6f6f6}

.grupo-titulo{font-size:16px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.grupo-titulo .bol{width:10px;height:10px;border-radius:50%}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.82);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:#111;border-radius:14px;overflow:hidden;width:min(960px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .frame{aspect-ratio:16/9;background:#000}
.modal iframe{width:100%;height:100%;border:0;display:block}
.modal .rod{padding:12px 16px;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.modal .rod .t{font-weight:600;flex:1;min-width:200px}
.modal .rod a,.modal .rod button{background:#2a2a31;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;text-decoration:none}
.modal .rod a:hover,.modal .rod button:hover{background:var(--mel);color:var(--tinta)}
.modal .nav{display:flex;gap:6px}

footer{text-align:center;color:var(--cinza);font-size:12.5px;padding:24px 20px 40px}
footer a{color:var(--mel-esc)}

@media (max-width:900px){
  .cards3{grid-template-columns:1fr 1fr}
  .cards3:not(.n2) .card-main:last-child{grid-column:1/-1}
  #mapa{height:360px}
}
/* ===== Celular ===== */
@media (max-width:640px){
  .topo-in{padding:10px 14px;gap:10px}
  .logo{width:36px;height:36px;font-size:19px}
  .topo h1{font-size:15px;line-height:1.2}
  .topo small{font-size:11.5px}
  .topo .home-btn{padding:6px 10px;font-size:12.5px;white-space:nowrap}
  main{padding:14px 12px 40px}

  .hero{padding:22px 18px}
  .hero h2{font-size:22px}
  .hero p{font-size:14px}
  .hero .nums{gap:8px 18px;display:grid;grid-template-columns:repeat(4,auto);justify-content:start}
  .hero .nums b{font-size:20px}
  .hero .nums span{font-size:11.5px}
  .hero .destaque{width:100%}

  .cards3,.cards3.n2{grid-template-columns:1fr;gap:14px;margin-top:16px}
  .card-main .capa{height:120px}
  .card-main .capa .ttl{font-size:17px}

  .secao{margin-top:26px}
  #mapa{height:300px}
  .mapa-ctl,.abas,.abas2{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
  .mapa-ctl::-webkit-scrollbar,.abas::-webkit-scrollbar,.abas2::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap}
  .abas2{padding:8px 10px}

  .edicoes{grid-template-columns:1fr 1fr;gap:10px}
  .ed{min-height:150px}
  .ed .in{padding:12px}
  .ed .pais{font-size:17px}
  .ed .cid,.ed .q{font-size:11.5px}

  .cab-cat{padding:18px}
  .cab-cat h2{font-size:20px}
  .cab-cat p{font-size:13.5px}

  .grade{grid-template-columns:1fr;gap:10px}
  .vid{flex-direction:row}
  .vid .th{width:42%;max-width:170px;flex:none;aspect-ratio:16/10}
  .vid .th .play{opacity:1;background:transparent}
  .vid .th .play span{width:34px;height:34px;font-size:13px}
  .vid .tx{padding:8px 10px;gap:6px;min-width:0}
  .vid .tt{font-size:13.5px}
  .tg{font-size:10.5px;padding:1px 6px}

  .modal{padding:0}
  .modal-box{border-radius:0;width:100%}
  .modal .rod{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .rod .t{grid-column:1/-1;font-size:14px;min-width:0}
  .modal .nav{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .rod a,.modal .rod button{padding:10px;text-align:center}
  .busca{max-width:none;font-size:16px}
}
@media (hover:none){.vid:hover,.card-main:hover,.ed:hover{transform:none;box-shadow:none}}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="logo" aria-hidden="true" onclick="ir('')">🐝</div>
    <div>
      <h1 id="topo-t">World Squash Masters</h1>
      <small>Vídeos de Marcelo Abelheira · canal Abelha das Raquetes</small>
    </div>
    <button class="home-btn" onclick="ir('')">⌂ Início</button>
  </div>
</header>

<main id="app"></main>

<div class="modal" id="modal" onclick="if(event.target===this)fecharVideo()">
  <div class="modal-box">
    <div class="frame"><iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <div class="rod">
      <div class="t" id="modal-t"></div>
      <div class="nav">
        <button onclick="passo(-1)" title="Vídeo anterior">◀ Anterior</button>
        <button onclick="passo(1)" title="Próximo vídeo">Próximo ▶</button>
      </div>
      <a id="modal-yt" target="_blank" rel="noopener">Abrir no YouTube ↗</a>
      <button onclick="fecharVideo()">✕ Fechar</button>
    </div>
  </div>
</div>

<footer id="rodape"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const ORDEM = ["pol2022","hol2024","aus2026"];
const PROXIMA = {ano:2028,pais:"África do Sul",bandeira:"",txt:"Próxima edição"};
const PADRAO = "aus2026";

/* ---------- Utilitários ---------- */
const thumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isT = v => v.m.some(x=>x==="T"||x.startsWith("T:"));
const cidadesDe = v => v.m.filter(x=>x.startsWith("c:")).map(x=>x.slice(2));
const cidTur = (E,v) => cidadesDe(v).filter(c=>E.cidTur.includes(c));
function pertence(E,cat,v){
  if(cat.tipo==="T") return isT(v);
  if(cat.tipo==="U") return v.m.some(x=>x.startsWith("U:")) || (cidTur(E,v).length>0 && !isT(v));
  return v.m.some(x=>x.startsWith(cat.tipo+":"));
}
function naSub(E,cat,v,s){
  if(s==="cid") return cidTur(E,v).length>0 && !isT(v);
  return v.m.includes(cat.tipo+":"+s);
}
function rotulo(E,m){
  if(m.startsWith("c:")) return E.cidades[m.slice(2)]?.nome||m;
  if(m==="T") return "Torneio";
  const [t,s]=m.split(":");
  const c=E.cats.find(c=>c.tipo===t); const sb=c?.subs.find(x=>x[0]===s);
  return sb?sb[1]:m;
}
function minutos(E){return Math.round(E.V.reduce((s,v)=>{const [m,ss]=v.d.split(":").map(Number);return s+m*60+ss},0)/60);}
/* Monta o endereço de uma tela: a edição padrão (Austrália) mantém os endereços curtos */
const rota = (ev,resto="") => ev===PADRAO ? resto : "e/"+ev+(resto?"/"+resto:"");

/* ---------- Navegação por hash ---------- */
function ir(h){ if(location.hash.slice(1)===h) render(); else location.hash=h; }
window.addEventListener("hashchange",render);
let mapa=null, listaAtual=[], idxAtual=0, E=EV[PADRAO], evAtual=PADRAO;

function render(){
  let h = decodeURIComponent(location.hash.slice(1)).split("/").filter(x=>x!=="");
  evAtual = PADRAO;
  if(h[0]==="e" && EV[h[1]]){ evAtual=h[1]; h=h.slice(2); }
  E = EV[evAtual];
  if(mapa){mapa.remove();mapa=null;}
  window.scrollTo(0,0);
  document.getElementById("topo-t").textContent = `World Squash Masters ${E.ano} · ${E.pais}`;
  document.title = `${E.titulo} — Vídeos`;
  document.getElementById("rodape").innerHTML = `Playlist no YouTube: <a href="https://www.youtube.com/playlist?list=${E.playlist}" target="_blank" rel="noopener">${esc(E.playlistNome)}</a> · ${E.V.length} vídeos · v3`;
  const cat = h[0]==="cat" ? E.cats.find(c=>c.k===h[1]) : null;
  if(cat) telaCategoria(cat,h[2]||"",h[3]||"");
  else if(h[0]==="cidade" && E.cidades[h[1]]) telaCidade(h[1]);
  else if(h[0]==="todos") telaTodos();
  else telaInicio();
}

  <section class="hero">
    <span class="tag">${esc(E.tag)}</span>

    <p>${esc(E.desc)}</p>
    <div class="nums">
      <div><b>${E.V.length}</b><span>vídeos</span></div>
      <div><b>${totT}</b><span>do torneio</span></div>
      <div><b>${nCid}</b><span>cidades</span></div>
      <div><b>${minutos(E)} min</b><span>de conteúdo</span></div>
    </div>
    ${E.destaque?`<button class="destaque" onclick="abrirVideo(${E.destaque[0]},true)">${esc(E.destaque[1])}</button>`:""}

    html += `
    <article class="card-main">
      <div class="capa" style="background-image:url(${thumb(c.capa)})" onclick="ir('${rota(evAtual,'cat/'+c.k)}')"><div class="ttl">${esc(c.nome)}</div></div>
      <div class="faixa" style="background:${c.cor}"></div>
      <div class="corpo">
        <div class="qtd">${lista.length} vídeos · ${esc(c.desc)}</div>
        <ul>${c.subs.map(([s,nm])=>`<li><button onclick="ir('${rota(evAtual,'cat/'+c.k+'/'+s)}')"><span>${esc(nm)}</span><span class="n">${lista.filter(v=>naSub(E,c,v,s)).length}</span></button></li>`).join("")}</ul>
        <button class="abrir" onclick="ir('${rota(evAtual,'cat/'+c.k)}')">Ver todos →</button>
      </div>
    </article>`;
  }
  html += `</div>
  <section class="secao">
    <h3>Mapa da viagem</h3>
    <p class="sub">Clique (ou toque) em uma cidade para ver todos os vídeos gravados lá.</p>
    <div id="mapa"></div>
    <div class="mapa-ctl">
      ${Object.entries(E.cidades).map(([k,c])=>`<button class="chip ${c.principal?'':'sec'}" onclick="ir('${rota(evAtual,'cidade/'+k)}')">📍 ${esc(c.nome)} <span class="n">${E.V.filter(v=>cidadesDe(v).includes(k)).length}</span></button>`).join("")}
      ${(E.zooms||[]).map((z,i)=>`<button class="chip" onclick="zoomEm(${i})">${z[0]}</button>`).join("")}
      <button class="chip" onclick="zoomRota()">🌍 Rota completa</button>
    </div>
  </section>
  <section class="secao">
    <h3>${evAtual===PADRAO?"Outras edições do World Squash Masters":"Edições do World Squash Masters"}</h3>
    <p class="sub">O campeonato mundial master acontece a cada 2 anos. Toque numa edição para ver os vídeos dela.</p>
    ${cardsEdicoes()}
  </section>
  <section class="secao">
    <h3>Todos os vídeos</h3>
    <p class="sub">Lista completa na ordem da playlist, com busca.</p>
    <button class="chip ativo" onclick="ir('${rota(evAtual,'todos')}')">Ver os ${E.V.length} vídeos →</button>
  </section>`;
  document.getElementById("app").innerHTML = html;
  listaAtual = E.V;
  montarMapa();
}

function cardsEdicoes(){
  const outras = ORDEM.filter(k=>k!==evAtual);
  let h = `<div class="edicoes">`;
  for(const k of outras){
    const e = EV[k];
    h += `<button class="ed" style="background-image:url(${thumb(e.capa)})" onclick="ir('${rota(k)}')">
      <div class="in"><span class="ano">${e.ano}</span>
        <div class="pais">${e.bandeira} ${esc(e.pais)}</div>
        <div class="cid">${esc(e.sede)}</div>
        <div class="q">${e.V.length} vídeos · ${e.cats.length} temas</div></div></button>`;
  }
  h += `<div class="ed breve"><span class="selo">Em breve</span>
      <div class="in"><span class="ano">${PROXIMA.ano}</span>
        <div class="pais">${PROXIMA.bandeira} ${esc(PROXIMA.pais)}</div>
        <div class="q">${esc(PROXIMA.txt)} — vídeos depois do torneio</div></div></div>`;
  return h + `</div>`;
}

function montarMapa(){
  if(typeof L==="undefined"){document.getElementById("mapa").innerHTML='<p style="padding:20px;color:#555">O mapa não carregou (sem conexão com a biblioteca). Use os botões de cidade abaixo.</p>';return;}
  mapa = L.map("mapa",{worldCopyJump:false,scrollWheelZoom:false});
  /* Base: Esri World Street Map (sem chave; funciona em arquivo local e no GitHub Pages).
     Se falhar, troca automaticamente para OpenStreetMap. */
  const camadas = [
    ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:'Mapa &copy; Esri'}],
    ["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}]
  ];
  let ic=0, erros=0, base=L.tileLayer(...camadas[0]).addTo(mapa);
  base.on("tileerror",function trocar(){
    if(++erros<4 || ic>=camadas.length-1) return;
    mapa.removeLayer(base); ic++; erros=0;
    base=L.tileLayer(...camadas[ic]).addTo(mapa); base.on("tileerror",trocar);
  });
  const C=E.cidades;
  for(const r of E.rota||[]) L.polyline(r.map(k=>C[k].ll),{color:"#1B1B1F",weight:2.5,dashArray:"6 7",opacity:.8}).addTo(mapa);
  for(const [k,c] of Object.entries(C)){
    const n = E.V.filter(v=>cidadesDe(v).includes(k)).length;
    const sz = c.principal?22:15;
    const icon = L.divIcon({className:"",html:`<div class="mk ${c.principal?'':'menor'}" style="width:${sz}px;height:${sz}px"></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const m = L.marker(c.ll,{icon}).addTo(mapa);
    m.bindPopup(`<div class="pop"><b>${esc(c.nome)}</b><br>${esc(c.desc)}<br><small>${n} vídeo(s)</small><button onclick="ir('${rota(evAtual,'cidade/'+k)}')">Ver vídeos →</button></div>`);
    const dir = c.dir||"right";
    const off = {left:[-12,0],right:[12,0],bottom:[0,12],top:[0,-12]}[dir];
    m.bindTooltip(c.nome,{permanent:c.principal,direction:dir,offset:off,className:"mk-lbl"});
  }
  if(E.inicio) enquadrar(E.inicio); else zoomRota();
}
function enquadrar(keys){
  if(!mapa) return;
  const pts = keys.map(k=>E.cidades[k].ll);
  mapa.fitBounds(pts,{padding:[50,50],maxZoom:E.maxZoomInicial||10});
}
function zoomRota(){enquadrar(Object.keys(E.cidades));}
function zoomEm(i){enquadrar(E.zooms[i][1]);}

/* ---------- Categoria ---------- */
function telaCategoria(c,s,cid){
  const base = E.V.filter(v=>pertence(E,c,v));
  let lista = s ? base.filter(v=>naSub(E,c,v,s)) : base;
  if(s==="cid" && cid) lista = lista.filter(v=>cidadesDe(v).includes(cid));
  const nomeSub = s ? c.subs.find(x=>x[0]===s)?.[1] : "";
  const R = x => rota(evAtual,x);
  let html = `<button class="voltar" onclick="ir('${R('')}')">← Voltar ao início da edição ${E.ano}</button>
  <div class="cab-cat" style="background:${c.grad}"><div class="ev">${E.bandeira} ${esc(E.titulo)}</div><h2>${esc(c.nome)}</h2><p>${esc(c.desc)}</p></div>
  <div class="abas">
    <button class="chip ${!s?'ativo':''}" onclick="ir('${R('cat/'+c.k)}')">Todos <span class="n">${base.length}</span></button>
    ${c.subs.map(([sk,nm])=>`<button class="chip ${s===sk?'ativo':''}" onclick="ir('${R('cat/'+c.k+'/'+sk)}')">${esc(nm)} <span class="n">${base.filter(v=>naSub(E,c,v,sk)).length}</span></button>`).join("")}
  </div>`;
  if(s==="cid"){
    const tot = base.filter(v=>naSub(E,c,v,"cid"));
    html += `<div class="abas2"><span class="rot">Cidade:</span>
      <button class="chip ${!cid?'ativo':''}" onclick="ir('${R('cat/'+c.k+'/cid')}')">Todas <span class="n">${tot.length}</span></button>
      ${E.cidTur.filter(ck=>tot.some(v=>cidadesDe(v).includes(ck))).map(ck=>`<button class="chip ${cid===ck?'ativo':''}" onclick="ir('${R('cat/'+c.k+'/cid/'+ck)}')">${esc(E.cidades[ck].nome)} <span class="n">${tot.filter(v=>cidadesDe(v).includes(ck)).length}</span></button>`).join("")}
    </div>`;
  }
  const semSub = c.tipo==="T" && !s && base.some(v=>v.m.includes("T") && !v.m.some(x=>x.startsWith("T:")));
  const nota = semSub ? " Os vídeos sem subdivisão identificada aparecem só em “Todos”." : "";
  html += `<p class="info-lista">${lista.length} vídeo(s)${nomeSub?` em <b>${esc(nomeSub)}${cid?" · "+esc(E.cidades[cid].nome):""}</b>`:""}.${nota}</p>`;
  if(s==="cid" && !cid){
    listaAtual=[];
    for(const ck of E.cidTur){
      const l = lista.filter(v=>cidadesDe(v).includes(ck));
      if(!l.length) continue;
      html += `<div class="grupo-titulo"><span class="bol" style="background:${c.cor}"></span>${esc(E.cidades[ck].nome)} (${l.length})</div>${grade(l)}`;
      listaAtual.push(...l);
    }
  } else { html += grade(lista); listaAtual = lista; }
  document.getElementById("app").innerHTML = html;
}

/* ---------- Cidade (a partir do mapa) ---------- */
function telaCidade(k){
  const c = E.cidades[k];
  const lista = E.V.filter(v=>cidadesDe(v).includes(k));
  let html = `<button class="voltar" onclick="ir('${rota(evAtual)}')">← Voltar ao mapa</button>
  <div class="cab-cat" style="background:linear-gradient(120deg,#1B1B1F,#4a3d12)"><div class="ev">${E.bandeira} ${esc(E.titulo)}</div><h2>📍 ${esc(c.nome)}</h2><p>${esc(c.desc)} · ${lista.length} vídeo(s)</p></div>
  <div class="abas">${Object.entries(E.cidades).map(([ck,cc])=>`<button class="chip ${ck===k?'ativo':''} ${cc.principal?'':'sec'}" onclick="ir('${rota(evAtual,'cidade/'+ck)}')">${esc(cc.nome)}</button>`).join("")}</div>`;
  const usados = new Set(); listaAtual=[];
  for(const cat of E.cats){
    const l = lista.filter(v=>pertence(E,cat,v));
    if(!l.length) continue;
    l.forEach(v=>usados.add(v.n));
    html += `<div class="grupo-titulo"><span class="bol" style="background:${cat.cor}"></span>${esc(cat.nome)} (${l.length})</div>${grade(l)}`;
    listaAtual.push(...l);
  }
  const resto = lista.filter(v=>!usados.has(v.n));
  if(resto.length){html += `<div class="grupo-titulo"><span class="bol" style="background:#999"></span>Outros (${resto.length})</div>${grade(resto)}`;listaAtual.push(...resto);}
  document.getElementById("app").innerHTML = html;
}

/* ---------- Todos com busca ---------- */
function telaTodos(){
  document.getElementById("app").innerHTML = `<button class="voltar" onclick="ir('${rota(evAtual)}')">← Voltar ao início da edição ${E.ano}</button>
  <div class="cab-cat" style="background:linear-gradient(120deg,#1B1B1F,#3a3a44)"><div class="ev">${E.bandeira} ${esc(E.titulo)}</div><h2>Todos os vídeos</h2><p>${E.V.length} vídeos na ordem da playlist</p></div>
  <div style="margin:18px 0 6px"><input class="busca" id="busca" placeholder="Buscar por título, cidade ou tema…" oninput="filtrar()"></div>
  <p class="info-lista" id="info"></p><div id="res"></div>`;
  filtrar();
}
function semAcento(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function filtrar(){
  const q = semAcento(document.getElementById("busca").value.trim());
  const l = E.V.filter(v=>{
    if(!q) return true;
    const txt = semAcento(v.t+" "+v.m.map(m=>rotulo(E,m)).join(" "));
    return q.split(/\s+/).every(p=>txt.includes(p));
  });
  document.getElementById("info").textContent = `${l.length} vídeo(s)`;
  document.getElementById("res").innerHTML = grade(l);
  listaAtual = l;
}

/* ---------- Componentes ---------- */
function grade(l){
  return `<div class="grade">${l.map(v=>`
    <div class="vid" onclick="abrirVideo(${v.n})" title="${esc(v.t)}">
      <div class="th" style="background-image:url(${thumb(v.id)})"><span class="num">#${v.n}</span><span class="dur">${v.d}</span><div class="play"><span>▶</span></div></div>
      <div class="tx"><div class="tt">${esc(v.t)}</div>
        <div class="tags">${v.m.map(m=>`<span class="tg ${m.startsWith("c:")?"c":m[0]}">${esc(rotulo(E,m))}</span>`).join("")}</div>
      </div>
    </div>`).join("")}</div>`;
}
function abrirVideo(n,todos){
  if(todos) listaAtual = E.V;
  idxAtual = listaAtual.findIndex(v=>v.n===n);
  if(idxAtual<0){listaAtual=E.V;idxAtual=E.V.findIndex(v=>v.n===n);}
  mostrar();
  document.getElementById("modal").classList.add("on");
}
function mostrar(){
  const v = listaAtual[idxAtual];
  document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0`;
  document.getElementById("modal-t").textContent = `#${v.n} · ${v.t}`;
  document.getElementById("modal-yt").href = `https://www.youtube.com/watch?v=${v.id}&list=${E.playlist}`;
}
function passo(d){idxAtual=(idxAtual+d+listaAtual.length)%listaAtual.length;mostrar();}
function fecharVideo(){document.getElementById("modal").classList.remove("on");document.getElementById("player").src="";}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("modal").classList.contains("on"))return;
  if(e.key==="Escape")fecharVideo(); if(e.key==="ArrowRight")passo(1); if(e.key==="ArrowLeft")passo(-1);
});

render();
</script>
</body>
